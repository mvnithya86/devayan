<!DOCTYPE html>
<html>
<head>
<title>History MCQ Quiz</title>

<style>
body {
  font-family: Arial;
  background: #d6f0ff;
  text-align: center;
}

.quiz-box {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 60%;
  margin: auto;
  margin-top: 50px;
}

button {
  background: #fff5b1;
  border: none;
  padding: 10px;
  margin: 8px;
  width: 80%;
  border-radius: 10px;
  cursor: pointer;
  font-size: 18px;
}

.correct { background: lightgreen; }
.wrong { background: #ff9e9e; }

#result {
  display: none;
  font-size: 24px;
  margin-top: 20px;
}
</style>

</head>

<body>

<div class="quiz-box">
<h2>📘 Rise of Christianity Quiz</h2>
<p id="question"></p>
<div id="options"></div>
</div>

<div id="result"></div>

<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>

let questions = [

{q:"Who made Christianity a legal religion?",a:"Constantine"},
{q:"Capital shifted from Rome to?",a:"Constantinople"},
{q:"Jesus was born in?",a:"Bethlehem"},
{q:"Jesus grew up in?",a:"Nazareth"},
{q:"Roman governor who ordered trial of Jesus?",a:"Pontius Pilate"},
{q:"Jesus was executed by?",a:"Crucifixion"},
{q:"Jesus preached love for?",a:"Neighbours"},
{q:"Number of disciples of Jesus?",a:"12"},
{q:"First followers formed?",a:"Christian community"},
{q:"Teachings recorded in?",a:"Gospels"},

{q:"Who spread Christianity widely?",a:"Paul"},
{q:"Who is called foundation rock of Christianity?",a:"Peter"},
{q:"Christians were persecuted for how many years?",a:"300"},
{q:"Christianity became official religion in?",a:"4th century"},
{q:"Headquarters of Christianity became?",a:"St Peter's Basilica"},
{q:"Spiritual head of Christians?",a:"Pope"},
{q:"Medieval period means?",a:"Middle age"},
{q:"India medieval period starts from?",a:"8th century"},
{q:"India medieval period ends in?",a:"18th century"},
{q:"European medieval period?",a:"600 to 1500 CE"},

{q:"Who was King David?",a:"Israel king"},
{q:"Who ruled Jews under Romans?",a:"Herod"},
{q:"Messiah means?",a:"Saviour"},
{q:"Jesus taught love for?",a:"Enemies"},
{q:"Jesus rejected which rule?",a:"Eye for eye"},
{q:"Where was Jesus baptized?",a:"River"},
{q:"Who baptized Jesus?",a:"John"},
{q:"Holy Spirit appeared as?",a:"Dove"},
{q:"Jesus mission was to?",a:"Help people"},
{q:"Roman empire capital after shift?",a:"Constantinople"},

{q:"Who were Pharisees?",a:"Religious group"},
{q:"Jesus teachings were?",a:"Simple"},
{q:"Jesus believed in?",a:"One God"},
{q:"Christianity spread in?",a:"Roman empire"},
{q:"Who defeated Maxentius?",a:"Constantine"},
{q:"Christianity was earlier?",a:"Minority"},
{q:"Jesus died at age?",a:"30 approx"},
{q:"Nazareth is in?",a:"Galilee"},
{q:"Jerusalem is in?",a:"Judea"},
{q:"Samaria lies between?",a:"Galilee and Judea"},

{q:"Main message of Jesus?",a:"Love"},
{q:"Christians believed Jesus was?",a:"Son of God"},
{q:"Bible section for Jesus life?",a:"New Testament"},
{q:"Old Testament contains?",a:"Prophets"},
{q:"Jesus followers believed he?",a:"Resurrected"},
{q:"Jesus body placed in?",a:"Tomb"},
{q:"After how many days resurrection?",a:"3"},
{q:"Christianity spread through?",a:"Teachings"},
{q:"Jesus opposed?",a:"Injustice"},
{q:"Main value taught by Jesus?",a:"Compassion"}

];

let current = 0;
let score = 0;

function generateOptions(correct){
  let options = new Set();
  options.add(correct);

  let wrongOptions = [
    "Rome","India","Egypt","King","Temple","War","Peace","Law",
    "Asia","Europe","Leader","God","Church","City","River","Village"
  ];

  while(options.size < 4){
    let rand = wrongOptions[Math.floor(Math.random()*wrongOptions.length)];
    options.add(rand);
  }

  return [...options].sort(()=>Math.random()-0.5);
}

function loadQuestion() {
  if(current >= questions.length){
    showResult();
    return;
  }

  let q = questions[current];
  document.getElementById("question").innerText = (current+1) + ". " + q.q;

  let opts = generateOptions(q.a);

  let html = "";
  opts.forEach(opt=>{
    html += `<button onclick="checkAnswer(this,'${q.a}')">${opt}</button>`;
  });

  document.getElementById("options").innerHTML = html;
}

function checkAnswer(btn, correct){
  let buttons = document.querySelectorAll("button");
  buttons.forEach(b=>b.disabled=true);

  if(btn.innerText === correct){
    btn.classList.add("correct");
    document.getElementById("correctSound").play();
    score++;
  } else {
    btn.classList.add("wrong");
    document.getElementById("wrongSound").play();
  }

  setTimeout(()=>{
    current++;
    loadQuestion();
  },1000);
}

function showResult(){
  document.querySelector(".quiz-box").style.display="none";
  let res = document.getElementById("result");
  res.style.display="block";

  res.innerHTML = `
  🎉 Great Job! <br><br>
  Your Score: <b>${score} / ${questions.length}</b>
  `;
}

loadQuestion();

</script>

</body>
</html>
