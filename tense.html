let totalScore = 0;
const pageStatus = {}; // Keeps track of check states per page

function renderPage() {
    const pageData = quizData[currentPage - 1];
    const container = document.getElementById('dynamicPageContent');
    
    let html = `<div class="section-desc">${pageData.section}</div>`;
    
    pageData.questions.forEach((qObj, index) => {
        const qIndex = (currentPage - 1) * 10 + index + 1;
        html += `
            <div class="q-block" id="qBlock_${qIndex}" data-correct="${qObj.a}">
                <div class="q-text">${qObj.q}</div>
                <div class="options-container">
                    <label class="option-label"><input type="radio" name="q_${qIndex}" value="A"> A) ${qObj.o[0]}</label>
                    <label class="option-label"><input type="radio" name="q_${qIndex}" value="B"> B) ${qObj.o[1]}</label>
                    <label class="option-label"><input type="radio" name="q_${qIndex}" value="C"> C) ${qObj.o[2]}</label>
                    <label class="option-label"><input type="radio" name="q_${qIndex}" value="D"> D) ${qObj.o[3]}</label>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
    updateUIControls();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUIControls() {
    document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('progressBar').style.width = `${(currentPage / totalPages) * 100}%`;
    
    document.getElementById('prevBtn').disabled = (currentPage === 1);
    
    // Lock/Unlock control flow based on completion state
    const isChecked = pageStatus[currentPage];
    document.getElementById('nextBtn').disabled = !isChecked;
    document.getElementById('checkBtn').style.display = isChecked ? "none" : "inline-block";
    
    const resultBox = document.getElementById('pageResultBox');
    if (isChecked) {
        resultBox.style.display = "block";
        resultBox.className = "page-result success-bg";
        resultBox.innerText = `Answers evaluated for Page ${currentPage}! Press 'Next Page' to proceed.`;
    } else {
        resultBox.style.display = "none";
    }
}

function navigatePage(dir) {
    currentPage += dir;
    renderPage();
}

function checkPageAnswers() {
    const startIndex = (currentPage - 1) * 10 + 1;
    const endIndex = currentPage * 10;
    let pageValid = true;
    
    // Verify all 10 inputs on the current active view are filled out
    for (let i = startIndex; i <= endIndex; i++) {
        const selected = document.querySelector(`input[name="q_${i}"]:checked`);
        if (!selected) { pageValid = false; break; }
    }
    
    if (!pageValid) {
        alert("Please complete all 10 questions on this page before checking your score!");
        return;
    }
    
    let correctThisPage = 0;
    
    for (let i = startIndex; i <= endIndex; i++) {
        const block = document.getElementById(`qBlock_${i}`);
        const correctAnswer = block.getAttribute('data-correct');
        const selected = document.querySelector(`input[name="q_${i}"]:checked`);
        const labels = block.querySelectorAll('.option-label');
        
        // Remove hovering/active CSS profiles
        labels.forEach(lbl => lbl.className = 'option-label');
        
        if (selected.value === correctAnswer) {
            correctThisPage++;
            totalScore++;
            selected.parentElement.classList.add('correct-ans');
        } else {
            selected.parentElement.classList.add('incorrect-ans');
            labels.forEach(lbl => {
                if (lbl.querySelector('input').value === correctAnswer) {
                    lbl.classList.add('correct-ans');
                }
            });
        }
    }
    
    pageStatus[currentPage] = true;
    
    if (currentPage === totalPages) {
        displayFinalMatrix();
    } else {
        updateUIControls();
    }
}

function displayFinalMatrix() {
    document.getElementById('dynamicPageContent').style.display = "none";
    document.getElementById('footerControls').style.display = "none";
    document.getElementById('pageIndicator').style.display = "none";
    document.getElementById('pageResultBox').style.display = "none";
    document.getElementById('mainTitle').innerText = "System Audit Complete";
    
    const finalScreen = document.getElementById('final-screen');
    document.getElementById('finalScoreText').innerHTML = `Aggregate Score Rating:<br><span style='font-size:32px; color:#059669; font-weight:bold;'>${totalScore} / 100 Points</span><br>Overall Accuracy: ${Math.round((totalScore/100)*100)}%`;
    finalScreen.style.display = "block";
    document.getElementById('progressBar').style.width = "100%";
}

function resetQuiz() {
    currentPage = 1;
    totalScore = 0;
    document.getElementById('quizForm').reset();
    
    for (let i = 1; i <= totalPages; i++) { pageStatus[i] = false; }
    
    document.getElementById('dynamicPageContent').style.display = "block";
    document.getElementById('footerControls').style.display = "flex";
    document.getElementById('pageIndicator').style.display = "block";
    document.getElementById('mainTitle').innerText = "Tense Masterclass (100 Questions)";
    document.getElementById('final-screen').style.display = "none";
    
    renderPage();
}

// Initial application instantiation
window.onload = renderPage;
</script>
