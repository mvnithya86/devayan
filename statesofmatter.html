<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>States of Matter Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #cfe8f7; text-align: center; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; max-width: 550px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .clue-text { font-size: 18px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .target-word { font-size: 20px; font-weight: bold; color: #2c3e50; background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: none; background: #fff4b3; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ffeaa7; }
    #score { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    #result { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 20px; }
  </style>
</head>
<body>

<h2>🧪 Chapter: States of Matter</h2>
<div id="score">Score: 0</div>
<div class="box" id="quiz"></div>
<div id="result"></div>

<script>
let questions = [
  {q: "What is anything that has mass and takes up space called?", options: ["Matter", "Energy", "Light"], answer: 0},
  {q: "Everything in the world is made up of tiny building blocks called what?", options: ["Molecules", "Bricks", "Bubbles"], answer: 0},
  {q: "What are the three main states of matter?", options: ["Solid, liquid, and gas", "Hot, warm, and cold", "Ice, rain, and snow"], answer: 0},
  {q: "How are the molecules arranged inside a solid?", options: ["Packed tightly together in a fixed pattern", "Far apart and zooming around", "Sliding loosely past one another"], answer: 0},
  {q: "How do molecules move inside a solid?", options: ["They only vibrate or wiggle in place", "They zoom across the container at high speed", "They flow freely like a river"], answer: 0},
  {q: "Which state of matter has a fixed shape and a fixed volume?", options: ["Solid", "Liquid", "Gas"], answer: 0},
  {q: "If you move a wooden block from a small cup into a big bowl, what happens to its shape?", options: ["It stays the exact same shape", "It spreads out to fill the whole bowl", "It flattens to match the bottom of the bowl"], answer: 0},
  {q: "How do molecules move inside a liquid?", options: ["They stay close together and slide past each other", "They are locked tightly in straight rows", "They bounce far apart from each other"], answer: 0},
  {q: "Which state of matter has a fixed volume, but NO fixed shape?", options: ["Liquid", "Solid", "Gas"], answer: 0},
  {q: "What happens when you pour 100 mL of juice from a tall glass into a wide bowl?", options: ["Its shape changes, but its volume stays the same", "Both its shape and volume double", "Its shape stays tall like the glass"], answer: 0},
  {q: "How are the molecules arranged inside a gas?", options: ["Far apart with lots of empty space between them", "Packed shoulder-to-shoulder", "Arranged in neat, tight rows"], answer: 0},
  {q: "Which state of matter has NO fixed shape and NO fixed volume?", options: ["Gas", "Solid", "Liquid"], answer: 0},
  {q: "Why can you smell perfume across the room shortly after someone sprays it?", options: ["Gas molecules zoom out and spread to fill the whole room", "Perfume turns into tiny solid rocks", "Liquid molecules stay frozen in one corner"], answer: 0},
  {q: "Why can you easily squish a sealed syringe filled with air, but not one filled with water?", options: ["Air molecules have large empty spaces between them", "Water molecules are invisible", "Air has no molecules at all"], answer: 0},
  {q: "What happens to the molecules inside an ice cube when you heat it?", options: ["They gain energy, move faster, and slide apart to become water", "They stop moving completely", "They pack even tighter together"], answer: 0},
  {q: "What is the process of a solid turning into a liquid called?", options: ["Melting", "Freezing", "Condensation"], answer: 0},
  {q: "What is the process of a liquid turning into a solid called?", options: ["Freezing", "Evaporation", "Melting"], answer: 0},
  {q: "What is the process of a liquid turning into a gas called?", options: ["Evaporation", "Freezing", "Melting"], answer: 0},
  {q: "Water droplets forming on the outside of a cold juice glass is an example of what?", options: ["Condensation (gas turning back into liquid)", "Melting (solid turning into liquid)", "Freezing (liquid turning into solid)"], answer: 0},
  {q: "Why does a balloon attached to an empty bottle inflate when you place the bottle in hot water?", options: ["Heat makes the air molecules inside move faster and spread out", "Water leaks through the plastic into the balloon", "Cold air shrinks the bottle"], answer: 0},
  {q: "Which of the following is an example of a gas?", options: ["Steam rising from hot soup", "Honey in a jar", "An ice cube"], answer: 0},
  {q: "Which of the following is an example of a liquid?", options: ["Milk", "A pencil", "Helium inside a balloon"], answer: 0},
  {q: "What is the super-heated 4th state of matter found in lightning bolts and the Sun?", options: ["Plasma", "Steam", "Oobleck"], answer: 0},
  {q: "Why does Oobleck (cornstarch and water) act like a solid when you punch it quickly?", options: ["Pushing fast jams the molecules together", "It freezes instantly when touched", "All the water evaporates immediately"], answer: 0},
  {q: "Which state of matter can be poured and always takes the shape of its container?", options: ["Liquid", "Solid", "Crystal"], answer: 0}
];

let current = 0, score = 0, currentShuffledOptions = [], correctTextForCurrentQuestion = "";
let clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
let wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Quiz Completed! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<div class="clue-text">Question ${current + 1} of ${questions.length}:</div><div class="target-word">${q.q}</div>`;
  currentShuffledOptions.forEach((opt, index) => { html += `<button onclick="check(${index})">${opt}</button>`; });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  clickSound.play().catch(e => {});
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (currentShuffledOptions[idx] === correctTextForCurrentQuestion) btn.style.background = "#a8e6a3";
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) btn.style.background = "#ffb3b3";
  });

  if (selectedText === correctTextForCurrentQuestion) { score++; correctSound.play().catch(e => {}); }
  else { wrongSound.play().catch(e => {}); }

  document.getElementById("score").innerText = "Score: " + score + " / " + questions.length;
  setTimeout(() => { current++; loadQuestion(); }, 1500);
}
loadQuestion();
</script>
</body>
</html>
